spring.application.name=landing-api

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - deixa o pool encolher a 0 conexoes quando ocioso, para que o
# compute do Neon consiga autossuspender e nao fique ativo (consumindo
# CU-hours) sem trafego real de usuarios.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Actuator - separa liveness (nao toca no banco) de readiness (toca no
# banco). Monitores externos de uptime (ex.: UptimeRobot) devem apontar
# para /actuator/health/liveness, nunca para /actuator/health, senao cada
# ping abre uma conexao com o Postgres (Neon) e impede o autosuspend do
# compute, estourando o allowance mensal de CU-hours.
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.group.liveness.include[0]=livenessState
management.endpoint.health.group.readiness.include[0]=readinessState
management.endpoint.health.group.readiness.include[1]=db
management.endpoint.health.show-details=never

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

